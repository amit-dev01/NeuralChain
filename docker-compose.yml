version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: neuralchain_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - neuralchain_net

  redis:
    image: redis:7-alpine
    container_name: neuralchain_redis
    ports:
      - "6379:6379"
    networks:
      - neuralchain_net

  neo4j:
    image: neo4j:5-community
    container_name: neuralchain_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - neuralchain_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuralchain_backend
    env_file: .env
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    networks:
      - neuralchain_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuralchain_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - ./data:/app/data
    networks:
      - neuralchain_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuralchain_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - neuralchain_net

volumes:
  postgres_data:
  neo4j_data:

networks:
  neuralchain_net:
    driver: bridge
