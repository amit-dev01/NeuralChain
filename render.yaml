services:
  - type: web
    name: neuralchain-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MODEL_STORE_PATH
        value: models
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: neuralchain-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neuralchain-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: neuralchain-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: neuralchain-redis
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false

  - type: worker
    name: neuralchain-celery-worker
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_STORE_PATH
        value: models
      - key: DATABASE_URL
        fromDatabase:
          name: neuralchain-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neuralchain-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: neuralchain-redis
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false

databases:
  - name: neuralchain-postgres
    plan: free
    databaseName: neuralchain_db
    user: neuralchain

redis:
  - name: neuralchain-redis
    plan: free
    ipAllowList: []
