services:
  # --------------------------------------------------------------------------
  # 1. FastAPI Web Backend
  # --------------------------------------------------------------------------
  - type: web
    name: neuralchain-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MODEL_STORE_PATH
        value: models
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # Database: Supabase PostgreSQL
      - key: DATABASE_URL
        sync: false
      # Cache & Queue: Upstash Redis
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      # Graph Database: Neo4j AuraDB
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # Supabase API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Google GenAI / Gemini API
      - key: GEMINI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 2. Celery Worker (Background tasks & ML jobs)
  # --------------------------------------------------------------------------
  - type: worker
    name: neuralchain-celery-worker
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.celery_app.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_STORE_PATH
        value: models
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
